<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>罗马数字转换器</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #fafafa; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; }
        h1 { font-size: 1.25rem; font-weight: 600; margin-bottom: 16px; color: #333; }
        .card { background: #fff; border: 1px solid #e0e0e0; border-radius: 8px; padding: 24px; margin-bottom: 16px; }
        .form-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 8px; color: #333; font-weight: 500; }
        input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 16px; text-align: center; }
        .btn { padding: 8px 20px; border-radius: 4px; cursor: pointer; border: none; font-size: 14px; margin-right: 8px; }
        .btn-blue { background: #007bff; color: #fff; }
        .btn-gray { background: #6c757d; color: #fff; }
        .result { font-size: 2rem; text-align: center; padding: 20px; background: #f5f5f5; border-radius: 8px; margin-top: 16px; color: #333; font-weight: 600; }
        .error { color: #dc3545; font-size: 13px; margin-top: 8px; }
        .info { font-size: 12px; color: #666; margin-top: 8px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>罗马数字转换器</h1>
        <div class="card">
            <div class="form-group">
                <label>阿拉伯数字 (1-3999)</label>
                <input type="number" id="arabicInput" placeholder="输入数字，如 1987" min="1" max="3999" onkeypress="if(event.key==='Enter')toRoman()">
            </div>
            <button class="btn btn-blue" onclick="toRoman()">转换为罗马数字</button>
            <button class="btn btn-gray" onclick="document.getElementById('arabicInput').value='';document.getElementById('romanInput').value='';document.getElementById('result1').textContent='';document.getElementById('result2').textContent='';">清空</button>
            <div class="result" id="result1"></div>
            <div class="error" id="error1"></div>
        </div>
        <div class="card">
            <div class="form-group">
                <label>罗马数字</label>
                <input type="text" id="romanInput" placeholder="输入罗马数字，如 MCMLXXXVII" onkeypress="if(event.key==='Enter')toArabic()">
            </div>
            <button class="btn btn-blue" onclick="toArabic()">转换为阿拉伯数字</button>
            <div class="result" id="result2"></div>
            <div class="error" id="error2"></div>
            <div class="info">有效字符: I(1), V(5), X(10), L(50), C(100), D(500), M(1000)</div>
        </div>
    </div>
    <script>
        function toRoman() {
            const num = parseInt(document.getElementById('arabicInput').value);
            const result = document.getElementById('result1');
            const error = document.getElementById('error1');
            
            if (!num || num < 1 || num > 3999) {
                error.textContent = '请输入 1 到 3999 之间的整数';
                result.textContent = '';
                return;
            }
            
            error.textContent = '';
            result.textContent = intToRoman(num);
        }
        
        function intToRoman(num) {
            const thousands = ['', 'M', 'MM', 'MMM'];
            const hundreds = ['', 'C', 'CC', 'CCC', 'CD', 'D', 'DC', 'DCC', 'DCCC', 'CM'];
            const tens = ['', 'X', 'XX', 'XXX', 'XL', 'L', 'LX', 'LXX', 'LXXX', 'XC'];
            const ones = ['', 'I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX'];
            
            return thousands[Math.floor(num / 1000)] +
                   hundreds[Math.floor((num % 1000) / 100)] +
                   tens[Math.floor((num % 100) / 10)] +
                   ones[num % 10];
        }
        
        function romanToInt(s) {
            const romanValues = { I: 1, V: 5, X: 10, L: 50, C: 100, D: 500, M: 1000 };
            let result = 0;
            let prevValue = 0;
            
            for (let i = s.length - 1; i >= 0; i--) {
                const current = romanValues[s[i].toUpperCase()];
                if (current >= prevValue) {
                    result += current;
                } else {
                    result -= current;
                }
                prevValue = current;
            }
            return result;
        }
        
        function isValidRoman(s) {
            return /^[IVXLCDM]+$/i.test(s);
        }
        
        function toArabic() {
            const roman = document.getElementById('romanInput').value.trim();
            const result = document.getElementById('result2');
            const error = document.getElementById('error2');
            
            if (!roman) {
                error.textContent = '请输入罗马数字';
                result.textContent = '';
                return;
            }
            
            if (!isValidRoman(roman)) {
                error.textContent = '无效的罗马数字格式';
                result.textContent = '';
                return;
            }
            
            error.textContent = '';
            const num = romanToInt(roman);
            result.textContent = num.toString();
        }
    </script>
</body>
</html>
